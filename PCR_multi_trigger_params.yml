voltage:
  start: 0.00 # 0.14 # 0.010 # 0.08
  stop: 0.12 # 0.21 # 0.30
  step: 0.003
integration_time: 5
turn_off_after_pcr:
  cryo_amp: true
  thermal_source: true
  sim928: true

# Mode toggle: "thermal_source" or "qcl"
mode: "thermal_source"

# Gating delays in milliseconds (multiplied by 1e9 in the code to get ps)
gating_delays:
  thermal_source:
    on_start: 30
    on_stop: 270
    off_start: 450
    off_stop: 950
  qcl:
    on_start: 0.02  # 20 microseconds
    on_stop: 0.03   # 30 microseconds
    off_start: 0.8  # 800 microseconds (placeholder based on common QCL setups)
    off_stop: 0.95  # 950 microseconds

measurement_type: "filtered_pcr" # options are 'filtered_pcr' or 'dcr'

fudge_factor: 0.985  # Adjust this factor to calibrate the ratio_on value

filtered_PCR: 
  trigger_levels:
    # - "0.007"
    - "0.008"
    # - "0.009"
    - "0.010"
    # - "0.011"
    - "0.012"
    # - "0.013"
    # - "0.014"
    # - "0.015"
    # - "0.016"
    # - "0.017"
    # - "0.018"
    # - "0.019"
    # - "0.020"
    # - "0.021"
    # - "0.022"
    # - "0.023"
    # - "0.024"
    # - "0.025"
    # - "0.030"
    # - "0.060"
    # - "0.040"
    # - "0.048"
    # - "0.056"
    # - "0.015"
    # - "0.016"
DCR: 
  trigger_levels:
    - "-0.017"
    - "-0.025"
    - "-0.027"
