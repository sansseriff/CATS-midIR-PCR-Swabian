voltage:
  start: 0.01 # 0.14 # 0.010 # 0.08
  stop: 0.090 # 825 # 0.21 # 0.30
  step: 0.002
integration_time: 2
cycles: 6  # Number of full bias sweeps. Counts are averaged across cycles.
turn_off_after_pcr:
  cryo_amp: true
  thermal_source: true
  sim928: true

# Mode toggle: "thermal_source" or "qcl"
mode: "qcl" #"thermal_source"

pulse_rep_rate: 30 # should be 1 in thermal source mode

# Gating delays in milliseconds (multiplied by 1e9 in the code to get ps)
gating_delays:
  thermal_source:
    on_start: 30
    on_stop: 270
    off_start: 450
    off_stop: 950
  qcl:
    on_start: 0.100  
    on_stop: 0.290  
    off_start: 0.600  # 160 microseconds
    off_stop: 30 #0.340  

measurement_type: "filtered_pcr" # options are 'filtered_pcr' or 'dcr'

fudge_factor: 1  # Adjust this factor to calibrate the ratio_on value

filtered_PCR: 
  trigger_levels:
    # - "0.007"
    # - "0.008"
    # - "0.009"
    - "0.010"
    # - "0.011"
    - "0.012"
    # - "0.013"
    - "0.014"
    # - "0.015"
    - "0.016"
    # - "0.017"
    - "0.018"
    # - "0.019"
    - "0.020"
    # - "0.021"
    # - "0.022"
    # - "0.023"
    # - "0.024"
    # - "0.025"
    # - "0.030"
    # - "0.060"
    # - "0.040"
    # - "0.048"
    # - "0.056"
    # - "0.015"
    # - "0.016"
DCR: 
  trigger_levels:
    - "-0.017"
    - "-0.025"
    - "-0.027"
